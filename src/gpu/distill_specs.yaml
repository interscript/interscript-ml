  note: 'r7 teacher + Muon; E4 gate: beat the shipped 8.259 by >= 2pp'
ara-diac-small-2-gkd:
  # GKD rung (EXPERIMENTS.md "GKD — on-policy distillation rung"):
  # control run-006 verbatim; delta = reverse-KL on student-sampled
  # sequences scored by the frozen r7 teacher, ratio 0.3, annealed to
  # zero over the final third. Gate <= 4.5218; prediction 4.30-4.65.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  student_init: google/byt5-small
  optimizer: muon
  muon_lr: '0.01'
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-012-r7-muon-gkd
  labels_file: teacher_labels_r7.jsonl
  mode: sequence
  gkd:
    ratio: 0.3
    temperature: 1.0
    sample_every: 4
    sample_sub: 2
    sample_cap: 1024
ara-diac-small-layerdrop:
  teacher: rababa_arabic_byt5/run-006-morph/best
  teacher_volume: rababa
  out_volume: secryst
  student_init: google/byt5-small
  layer_drop: 'true'
  student_config:
    d_model: 1472
    d_kv: 64
    d_ff: 3584
    num_heads: 6
    enc_layers: 6
    dec_layers: 4
    feed_forward_proj: gated-gelu
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-006-layerdrop
  labels_file: teacher_labels_v2.jsonl
  labels_complete: 'true'
  mode: sequence
  note: depth-cut rung - encoder 12->6, width untouched, layers copied
    verbatim (both width-cut rungs failed); int4 target ~75MB; Muon
    optimizer per E3
  optimizer: muon
ara-diac-small-2-6ep:
  # G2a: the residual-attribution disambiguation - same as the 2.0 rung
  # (r7 labels, Muon, vanilla ByT5-small) at 6 epochs instead of 3.
  # If no gain, the 2.25pp residual is NOT undertraining -> domain.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  out_volume: rababa
  student_init: google/byt5-small
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-007-r7-muon-6ep
  labels_file: teacher_labels_r7.jsonl
  labels_complete: 'true'
  mode: sequence
  optimizer: muon
  note: G2a epochs-rung; gate vs 4.8218 - flat means domain-limited
ara-diac-small-d768:
  # G2b companion + frontier point: the UNTESTED gentle width cut
  # (2x, not 3.8x) with SVD stitch + Muon. ~105M params, int8 ~105MB.
  # Closes the "you never tried a gentle stitch" reviewer attack.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  out_volume: rababa
  student_init: google/byt5-small
  student_config:
    d_model: 768
    d_kv: 64
    d_ff: 1856
    num_heads: 12
    enc_layers: 12
    dec_layers: 4
    feed_forward_proj: gated-gelu
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-008-d768-stitch
  labels_file: teacher_labels_r7.jsonl
  labels_complete: 'true'
  mode: sequence
  optimizer: muon
  note: gentle-stitch rung (2x cut); frontier point at ~105M
ara-diac-small-layerdrop-6ep:
  # A2 from TODO.improve-compare: the lite rung gets the same levers
  # G2a had (6 epochs, Muon, r7 labels) - if it tracks G2a's gain,
  # the browser tier gets a 2.1-quality row at ~190M/int8 ~95MB int4.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  out_volume: rababa
  student_init: google/byt5-small
  layer_drop: 'true'
  student_config:
    d_model: 1472
    d_kv: 64
    d_ff: 3584
    num_heads: 6
    enc_layers: 6
    dec_layers: 4
    feed_forward_proj: gated-gelu
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-009-layerdrop-6ep
  labels_file: teacher_labels_r7.jsonl
  labels_complete: 'true'
  mode: sequence
  optimizer: muon
  note: A2 rung; gate tracks G2a (4.57) within 0.1pp at half depth
ara-diac-tiny-max:
  # THE gapless title test: the 30M class with the campaign's FULL
  # lever set — full corpus (24k+6k, not the 12k subset the collapse
  # rungs used), r7 labels, Muon, 6 epochs. If this still collapses,
  # the "30M encoder" claim dies by our own standard; if it works,
  # data quality rescued the small model and the title stands.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  out_volume: rababa
  student_config:
    d_model: 384
    d_kv: 64
    d_ff: 1536
    num_heads: 6
    enc_layers: 8
    dec_layers: 8
  train: r5-units/domain.txt
  train_extra:
  - r5-units/replay.txt
  unit_limits:
  - 24000
  - 6000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-010-tiny-max
  labels_file: teacher_labels_r7.jsonl
  labels_complete: 'true'
  mode: sequence
  optimizer: muon
  note: gapless 30M rung - full data + r7 + Muon + 6ep; the title
    claim's decisive test
ara-diac-small-2-6ep-tashkeela:
  # G2b: the domain-residual causal test (TODO.publish-client 01).
  # Identical to the G2a recipe (r7 teacher, Muon, 6 epochs, vanilla
  # ByT5-small) except the corpus: 144,662 units from the FULL cleaned
  # Tashkeela corpus (~5x the r5-units corpus) — classical Arabic books
  # + MSA. Gate: >= 0.5pp full-set DER improvement over G2a (4.5701)
  # attributes the residual to domain coverage; flat reframes it.
  teacher: rababa_arabic_byt5/run-007-news/best
  teacher_volume: rababa
  out_volume: rababa
  student_init: google/byt5-small
  train: tashkeela-units/train.txt
  train_extra: []
  unit_limits:
  - 48000
  max_len: 1450
  label_beams: '1'
  out: rababa_arabic_distill_small/run-011-tashkeela-6ep
  mode: sequence
  optimizer: muon
  note: G2b label-scale rung; 5x corpus, same levers; gate vs 4.5701
