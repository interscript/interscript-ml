name: rababa_arabic
description: Arabic diacritization — adds harakat to undiacritized Arabic text.
kind: rababa

data:
  module: rababa_arabic_data
  source: tashkeela_plus_plus
  max_val_samples: 2000
  cleaner: arabic

model:
  module: rababa_student
  student_arch: char_transformer
  # ~30M params = sweet spot for browser-targeted diacritization.
  # See docs/architecture.md. Smaller underfits; larger won't fit browser budget.
  student_layers: 6
  student_dim: 384
  student_heads: 6
  # No teacher. Direct supervised training on Tashkeela++ gold labels.
  # Tier-2 distillation from a fine-tuned ByT5-base teacher is available
  # via DistillTrainer if Tier-1 quality isn't sufficient.

train:
  epochs: 5
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  log_every: 50
  save_every: 1000
  out_dir: models/rababa_arabic

eval:
  module: der
  metric: der
  target_value: 0.05
  batch_size: 32

export:
  opset: 17
  quantize: false
