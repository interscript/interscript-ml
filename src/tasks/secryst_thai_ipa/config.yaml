name: secryst_thai_ipa
description: Thai → IPA transliteration via character-level transformer.
kind: secryst

data:
  module: secryst_thai_ipa_data
  source: wiktionary_thai_ipa
  max_val_samples: 1000
  cleaner: basic

model:
  module: secryst_student
  student_arch: char_transformer
  student_layers: 6
  student_dim: 384
  student_heads: 6
  # No teacher. Direct supervised training on Wiktionary Thai-IPA pairs.

train:
  epochs: 8
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  log_every: 50
  save_every: 1000
  out_dir: models/secryst_thai_ipa

eval:
  module: per
  metric: per
  target_value: 0.10
  batch_size: 32

export:
  opset: 17
  quantize: false
