name: rababa_hebrew
description: Hebrew diacritization (nikud) — adds vowels to undiacritized Hebrew text.
kind: rababa

data:
  module: rababa_hebrew_data
  source: sna_nikud
  max_val_samples: 1000
  cleaner: hebrew

model:
  module: rababa_hebrew_student
  student_arch: char_transformer
  student_layers: 6
  student_dim: 384
  student_heads: 6
  # No teacher. Direct supervised training on SNA Nikud gold labels.

train:
  epochs: 5
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  log_every: 50
  save_every: 1000
  out_dir: models/rababa_hebrew

eval:
  module: der_hebrew
  metric: der_hebrew
  target_value: 0.05
  batch_size: 32

export:
  opset: 17
  quantize: false
